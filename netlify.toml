[build]
  command = "npm run build"
  publish = "dist"

# Skip Netlify deploy if commit message contains [skip deploy] or [skip ci]
# Usage: git commit -m "fix: update SQL schema [skip deploy]"
[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
