[build]
  command = "npm run build"
  publish = "dist"
  # Skip deploy if the latest commit message contains [skip netlify]
  # Usage: git commit -m "fix: update database schema [skip netlify]"
  ignore = "git log -1 --pretty=%B | grep -qF '[skip netlify]'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://translate.google.com https://translate.googleapis.com https://checkout.razorpay.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://translate.googleapis.com https://www.gstatic.com; font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com; img-src 'self' data: https://*.supabase.co https://translate.google.com https://www.google.com https://translate.googleapis.com https://www.gstatic.com https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.firebaseio.com wss://*.firebaseio.com https://api.razorpay.com https://*.googleapis.com; frame-src 'self' https://drive.google.com https://api.razorpay.com https://checkout.razorpay.com; frame-ancestors 'none';"
