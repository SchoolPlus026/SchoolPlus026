[build]
  command = "npm run build"
  publish = "dist"
  # Skip deploy if the latest commit message contains [skip netlify]
  # Usage: git commit -m "fix: update database schema [skip netlify]"
  ignore = "git log -1 --pretty=%B | grep -qF '[skip netlify]'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
