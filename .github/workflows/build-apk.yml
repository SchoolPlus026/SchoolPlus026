name: Build Android APK (SchoolOS+)

# ── TRIGGER STRATEGY ──────────────────────────────────────────────────────────
# Builds ONLY fire on version tags (e.g. v1.0.5) or manual dispatch.
# This prevents burning Netlify + GitHub Actions minutes on every code commit.
# To release a new APK: git tag v1.0.X && git push origin v1.0.X
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'v*'           # Only fire on version tags: v1.0.0, v1.0.5, v2.0.0, etc.
  workflow_dispatch:   # Also allows manual "Run workflow" click from GitHub UI

jobs:
  build-apk:
    name: Build SchoolOS+ APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required for softprops/action-gh-release to create releases & upload assets

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔐 Create .env file from GitHub Secrets
        # Belt-and-suspenders: write a .env file so Vite picks up all vars
        # regardless of whether they are passed via the env: block or read from .env
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_APP_VERSION_CODE=${{ github.run_number }}" >> .env
          echo "VITE_APP_VERSION_NAME=${{ github.ref_name }}" >> .env
          echo "✅ .env file created with all VITE_ variables"

      - name: 🏗️ Build React Vite Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_APP_VERSION_NAME: ${{ github.ref_name || format('1.0.{0}', github.run_number) }}

      - name: 🚀 Add & Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🪄 Inject Gradle Mirror Repos (bypass GitHub Actions Maven 403)
        # GitHub Actions IPs are intermittently blocked by Maven Central CDN (403 Forbidden).
        # An init.gradle script globally injects fallback mirrors BEFORE Gradle resolves
        # any dependencies. This runs after cap sync so the android/ dir exists.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITEOF'
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://maven.google.com' }
                maven { url 'https://jcenter.bintray.com' }
                maven { url 'https://plugins.gradle.org/m2/' }
                google()
                mavenCentral()
              }
            }
            repositories {
              maven { url 'https://maven.google.com' }
              maven { url 'https://jcenter.bintray.com' }
              maven { url 'https://plugins.gradle.org/m2/' }
              google()
              mavenCentral()
            }
          }
          INITEOF
          echo "✅ init.gradle written to ~/.gradle/init.gradle"
          cat ~/.gradle/init.gradle

      - name: 🔔 Patch AndroidManifest.xml — Add FCM Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not found at $MANIFEST"
            exit 1
          fi
          sed -i 's|</manifest>|    <!-- FCM: Android 13+ POST_NOTIFICATIONS runtime permission (REQUIRED) -->\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <!-- FCM: Notification vibration support -->\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <!-- FCM: Wake device to deliver messages reliably -->\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <!-- FCM: Re-register token after device reboot -->\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>|' "$MANIFEST"
          echo "✅ FCM permissions patched into AndroidManifest.xml"
          grep -q "POST_NOTIFICATIONS" "$MANIFEST" && echo "✅ POST_NOTIFICATIONS confirmed" || (echo "❌ Patch FAILED" && exit 1)

      - name: 🔑 Inject google-services.json for FCM
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json written to android/app/"

      - name: 🗝️ Generate Signing Keystore
        # Auto-generates a keystore on the runner using its built-in Java.
        # Since the app is not on the Play Store, a fresh key per build is fine for sideloading.
        # Alias is hardcoded as 'schoolos' — this matches KEY_ALIAS secret and build.gradle.
        run: |
          JAVA_KEYTOOL=$(find /usr/lib/jvm -name "keytool" 2>/dev/null | head -1)
          if [ -z "$JAVA_KEYTOOL" ]; then
            JAVA_KEYTOOL=$(which keytool 2>/dev/null || true)
          fi
          echo "Using keytool: $JAVA_KEYTOOL"
          "$JAVA_KEYTOOL" -genkeypair -v \
            -keystore ${{ github.workspace }}/schoolos.jks \
            -alias schoolos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=SchoolOS, OU=App, O=SchoolOS, L=Mumbai, S=MH, C=IN" \
            -storepass ${{ secrets.STORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }}
          echo "✅ Keystore generated at ${{ github.workspace }}/schoolos.jks"

      - name: 🎨 Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: 🧹 Clean Conflicting Default Android XML Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

      - name: ☕ Setup Java JDK 17 (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔨 Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔧 Configure Gradle Signing
        # Writes signing config into local.properties so it's picked up by build.gradle
        # keyAlias is hardcoded as 'schoolos' to match the auto-generated keystore above
        run: |
          cat >> android/local.properties << EOF
          storeFile=${{ github.workspace }}/schoolos.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=schoolos
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 🔖 Patch versionCode and versionName from Git Tag
        run: |
          TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "refs/heads/main" ]; then
            VERSION_NAME="1.0.${{ github.run_number }}-${SHORT_SHA}"
            TAG="v$VERSION_NAME"
          else
            VERSION_NAME="${TAG#v}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Patched -> versionCode=$VERSION_CODE, versionName=$VERSION_NAME"

      - name: ⚙️ Compile Signed Release APK
        # assembleRelease uses the keystore configured above.
        # --no-daemon: prevents Gradle daemon issues in CI environments
        # --stacktrace: surfaces real error if 403 or resolution fails
        # Note: alias is hardcoded as 'schoolos' to match auto-generated keystore
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/schoolos.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=schoolos \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: 📦 Rename APK for Release
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Fallback for manual dispatch (no tag)
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "refs/heads/main" ]; then
            VERSION_TAG="v1.0.${{ github.run_number }}-${SHORT_SHA}"
          fi
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="SchoolOS_Plus_${VERSION_TAG}.apk"
          # Try release first, fall back to unsigned
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_FILE=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "✅ APK ready: $APK_DEST"

      - name: 🚀 Create GitHub Release with APK
        # This creates a PUBLIC GitHub Release with the APK as a downloadable asset.
        # The direct download URL will be:
        # https://github.com/<owner>/<repo>/releases/download/<tag>/SchoolOS_Plus_<tag>.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "SchoolOS+ ${{ env.VERSION_TAG }}"
          body: "🚀 Automated release from GitHub Actions CI/CD pipeline.\n\nInstall the APK directly from the assets below. Users with the previous version can update without uninstalling."
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Register Version in Supabase
        # Stores the DIRECT APK download URL (not the webpage URL) in app_versions.
        # VersionChecker.jsx uses this URL to open the APK in the system browser.
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="${{ env.VERSION_TAG }}"
          REPO="${{ github.repository }}"
          APK_FILE="${{ env.APK_FILE }}"
          
          # Direct download URL — no login required, works in Capacitor Browser plugin
          APK_URL="https://github.com/${REPO}/releases/download/${VERSION_NAME}/${APK_FILE}"
          
          curl -sS -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/app_versions" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"version_code\": $VERSION_CODE,
              \"version_name\": \"$VERSION_NAME\",
              \"apk_url\": \"$APK_URL\",
              \"release_notes\": \"Automated CI/CD release $VERSION_NAME from GitHub Actions.\",
              \"is_critical\": false
            }"
          echo "Version $VERSION_NAME (code: $VERSION_CODE) registered in Supabase."
          echo "Direct APK URL: $APK_URL"

      - name: 🔔 Notify All Devices via FCM
        # Calls notify-update Edge Function which fans out FCM push notifications
        # to every device_token row. Users learn about the update without opening app.
        run: |
          HTTP_STATUS=$(curl -sS -o /tmp/notify_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/notify-update" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"version_name\": \"${{ env.VERSION_TAG }}\", \"release_notes\": \"SchoolOS+ ${{ env.VERSION_TAG }} is now available. Open the app to install it.\"}")
          echo "Notify HTTP status: $HTTP_STATUS"
          cat /tmp/notify_response.txt
