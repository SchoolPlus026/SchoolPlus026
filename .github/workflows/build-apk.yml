name: Build Android APK (SchoolOS+)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually click "Run workflow" from GitHub UI

jobs:
  build-apk:
    name: Build SchoolOS+ APK
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install

      - name: 🏗️ Build React Vite Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🚀 Add & Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🔔 Patch AndroidManifest.xml — Add FCM Permissions
        # CRITICAL: The android/ folder is git-ignored and fully regenerated each run.
        # cap sync produces a minimal manifest with only INTERNET permission.
        # Android 13+ (API 33+) REQUIRES POST_NOTIFICATIONS declared in the manifest
        # or requestPermissions() throws a SecurityException → immediate app crash.
        # We patch the manifest here, after sync, every CI run.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Verify the file exists before patching
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not found at $MANIFEST"
            exit 1
          fi
          # Insert FCM permissions block before the closing </manifest> tag.
          # sed -i edits in-place; the \n sequences produce real newlines.
          sed -i 's|</manifest>|    <!-- FCM: Android 13+ POST_NOTIFICATIONS runtime permission (REQUIRED) -->\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <!-- FCM: Notification vibration support -->\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <!-- FCM: Wake device to deliver messages reliably -->\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <!-- FCM: Re-register token after device reboot -->\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n</manifest>|' "$MANIFEST"
          echo "✅ FCM permissions patched into AndroidManifest.xml"
          # Verify the patch was applied
          grep -q "POST_NOTIFICATIONS" "$MANIFEST" && echo "✅ POST_NOTIFICATIONS confirmed" || (echo "❌ Patch FAILED" && exit 1)

      - name: 🔑 Inject google-services.json for FCM
        # The android/ directory is git-ignored and rebuilt fresh every CI run.
        # google-services.json CANNOT be committed. Instead:
        #   1. Go to GitHub → Settings → Secrets → Actions
        #   2. Create secret: GOOGLE_SERVICES_JSON_BASE64
        #   3. Value: base64-encode your google-services.json file
        #      PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("google-services.json"))
        #      Linux/Mac:  base64 -w 0 google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json written to android/app/"

      - name: 🎨 Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: 🧹 Clean Conflicting Default Android XML Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

      - name: ☕ Setup Java JDK 17 (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔨 Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: ⚙️ Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Upload APK as SchoolOS_Plus
        uses: actions/upload-artifact@v4
        with:
          name: SchoolOS_Plus
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
