name: Build Android APK (SchoolOS+)

# ── TRIGGER STRATEGY ──────────────────────────────────────────────────────────
# Builds ONLY fire on version tags (e.g. v1.0.5) or manual dispatch.
# This prevents burning Netlify + GitHub Actions minutes on every code commit.
# To release a new APK: git tag v1.0.X && git push origin v1.0.X
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main           # Build APK on every push to main for rapid testing
    tags:
      - 'v*'           # Also build on version tags for formal releases
  workflow_dispatch:   # Manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build SchoolOS+ APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Required for softprops/action-gh-release to create releases & upload assets

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🔐 Create .env file from GitHub Secrets
        # Belt-and-suspenders: write a .env file so Vite picks up all vars
        # regardless of whether they are passed via the env: block or read from .env
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_APP_VERSION_CODE=${{ github.run_number }}" >> .env
          echo "VITE_APP_VERSION_NAME=${{ github.ref_name }}" >> .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}" >> .env
          echo "✅ .env file created with all VITE_ variables (including Firebase)"
 
      - name: 🏗️ Build React Vite Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_APP_VERSION_NAME: ${{ github.ref_name || format('1.0.{0}', github.run_number) }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: 🚀 Add & Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🐘 Upgrade Gradle Wrapper to 8.7 (Required for Java 21)
        run: |
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER" ]; then
            sed -i 's/gradle-[0-9.]\+-all.zip/gradle-8.7-all.zip/' "$WRAPPER"
            echo "✅ Gradle Wrapper upgraded to 8.7"
            grep "gradle-8.7-all.zip" "$WRAPPER"
          else
            echo "⚠️  Gradle Wrapper properties not found at $WRAPPER"
          fi

      - name: ⚙️ Patch Android Variables & Java Version (Passkey Support)
        run: |
          VARIABLES="android/variables.gradle"
          if [ -f "$VARIABLES" ]; then
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' "$VARIABLES"
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 35/' "$VARIABLES"
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 35/' "$VARIABLES"
            echo "✅ variables.gradle patched for Passkey (minSdk 24, targetSdk 35)"
          fi
          
          BUILD_GRADLE="android/app/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            perl -pi -e 's/(compileSdk rootProject.*)/$1\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_21\n        targetCompatibility JavaVersion.VERSION_21\n    }/' "$BUILD_GRADLE"
            echo "✅ app/build.gradle patched with Java 21 compileOptions"
          fi

      - name: 🪄 Inject Gradle Mirror Repos (bypass GitHub Actions Maven 403)
        # GitHub Actions IPs are intermittently blocked by Maven Central CDN (403 Forbidden).
        # An init.gradle script globally injects fallback mirrors BEFORE Gradle resolves
        # any dependencies. This runs after cap sync so the android/ dir exists.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITEOF'
          allprojects {
            buildscript {
              repositories {
                maven { url 'https://maven.google.com' }
                maven { url 'https://jcenter.bintray.com' }
                maven { url 'https://plugins.gradle.org/m2/' }
                google()
                mavenCentral()
              }
            }
            repositories {
              maven { url 'https://maven.google.com' }
              maven { url 'https://jcenter.bintray.com' }
              maven { url 'https://plugins.gradle.org/m2/' }
              google()
              mavenCentral()
            }
          }
          INITEOF
          echo "✅ init.gradle written to ~/.gradle/init.gradle"
          cat ~/.gradle/init.gradle

      - name: 🔔 Patch AndroidManifest.xml — Add FCM, Geolocation & OTA Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "❌ AndroidManifest.xml not found at $MANIFEST"
            exit 1
          fi
          # 1. Add FCM and Geolocation permissions right before </manifest>
          sed -i 's|</manifest>|    <!-- Geolocation Permissions -->\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />\n    <!-- FCM: Android 13+ POST_NOTIFICATIONS runtime permission (REQUIRED) -->\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <!-- FCM: Notification vibration support -->\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <!-- FCM: Wake device to deliver messages reliably -->\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <!-- FCM: Allows FCM token refresh after device reboot -->\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <!-- OTA Update: Required to install downloaded APKs in-app (Android 8+) -->\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <!-- Camera and Media Permissions for Scanner & Plugin Stability -->\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>|' "$MANIFEST"

          # 2. Add custom deep link (schoolosplus) and WebAuthn app link intent filters right before </activity>
          sed -i 's|</activity>|            <!-- Custom Deep Links (oauth2redirect) -->\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="schoolosplus" android:host="oauth2redirect" />\n            </intent-filter>\n            <!-- Custom Deep Links (dashboard) -->\n            <intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="schoolosplus" android:host="dashboard" />\n            </intent-filter>\n            <!-- WebAuthn App Links -->\n            <intent-filter android:autoVerify="true">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="https" android:host="schoolpro-d95a8.web.app" />\n            </intent-filter>\n        </activity>|' "$MANIFEST"

          echo "✅ FCM, Geolocation, OTA & Deep Link permissions patched into AndroidManifest.xml"
          grep -q "ACCESS_FINE_LOCATION" "$MANIFEST" && echo "✅ Geolocation confirmed" || (echo "❌ Patch FAILED" && exit 1)
          grep -q "REQUEST_INSTALL_PACKAGES" "$MANIFEST" && echo "✅ OTA install permission confirmed" || (echo "❌ OTA patch FAILED" && exit 1)
          grep -q "schoolosplus" "$MANIFEST" && echo "✅ Deep Link scheme confirmed" || (echo "❌ Deep Link patch FAILED" && exit 1)

      - name: 🔑 Inject google-services.json for FCM
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          echo "✅ google-services.json written to android/app/"

      - name: 🗝️ Restore or Generate Signing Keystore
        # STRATEGY: Restore from KEYSTORE_BASE64 secret if set (ensures same signature every
        # build so users can do OTA updates). If secret is empty/unset, auto-generate once
        # and print the base64 — save that value as KEYSTORE_BASE64 secret for future builds.
        # Alias is ALWAYS 'schoolos' — hardcoded to prevent KEY_ALIAS mismatch.
        run: |
          KEYSTORE_PATH="${{ github.workspace }}/schoolos.jks"
          B64="${{ secrets.KEYSTORE_BASE64 }}"

          if [ -n "$B64" ] && [ "$B64" != "" ]; then
            echo "🔑 Restoring keystore from KEYSTORE_BASE64 secret..."
            echo "$B64" | base64 --decode > "$KEYSTORE_PATH"
            echo "✅ Keystore restored: $(ls -lh $KEYSTORE_PATH | awk '{print $5}')"
          else
            echo "⚠️  KEYSTORE_BASE64 secret not set — generating a new keystore..."
            JAVA_KEYTOOL=$(find /usr/lib/jvm -name "keytool" 2>/dev/null | head -1)
            if [ -z "$JAVA_KEYTOOL" ]; then
              JAVA_KEYTOOL=$(which keytool 2>/dev/null || true)
            fi
            "$JAVA_KEYTOOL" -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias schoolos \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=SchoolOS, OU=App, O=SchoolOS, L=Mumbai, S=MH, C=IN" \
              -storepass ${{ secrets.STORE_PASSWORD }} \
              -keypass ${{ secrets.KEY_PASSWORD }}
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "ACTION REQUIRED: Copy the base64 below and save it"
            echo "as GitHub Secret: KEYSTORE_BASE64"
            echo "This ensures the same key is used for all future APK"
            echo "builds, allowing users to install updates over old APKs."
            echo "════════════════════════════════════════════════════"
            base64 -w 0 "$KEYSTORE_PATH"
            echo ""
            echo "════════════════════════════════════════════════════"
            echo "✅ Keystore generated at $KEYSTORE_PATH"
          fi

      - name: 🎨 Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: 🧹 Clean Conflicting Default Android XML Icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/*
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

      - name: ☕ Setup Java JDK 21 (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 🔨 Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🔧 Configure Gradle Signing
        # Writes signing config into local.properties so it's picked up by build.gradle
        # keyAlias is hardcoded as 'schoolos' to match the auto-generated keystore above
        run: |
          cat >> android/local.properties << EOF
          storeFile=${{ github.workspace }}/schoolos.jks
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyAlias=schoolos
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 🔖 Patch versionCode and versionName from Git Tag
        run: |
          TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "refs/heads/main" ]; then
            VERSION_NAME="1.0.${{ github.run_number }}-${SHORT_SHA}"
            TAG="v$VERSION_NAME"
          else
            VERSION_NAME="${TAG#v}"
          fi
          VERSION_CODE="${{ github.run_number }}"
          sed -i "s/versionCode .*/versionCode $VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"$VERSION_NAME\"/" android/app/build.gradle
          echo "Patched -> versionCode=$VERSION_CODE, versionName=$VERSION_NAME"

      - name: ⚙️ Compile Signed Release APK
        # assembleRelease uses the keystore configured above.
        # --no-daemon: prevents Gradle daemon issues in CI environments
        # --stacktrace: surfaces real error if 403 or resolution fails
        # Note: alias is hardcoded as 'schoolos' to match auto-generated keystore
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/schoolos.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=schoolos \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: 📦 Rename APK for Release
        run: |
          VERSION_TAG="${{ github.ref_name }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          # Fallback for manual dispatch (no tag)
          if [ -z "$VERSION_TAG" ] || [ "$VERSION_TAG" = "main" ] || [ "$VERSION_TAG" = "refs/heads/main" ]; then
            VERSION_TAG="v1.0.${{ github.run_number }}-${SHORT_SHA}"
          fi
          APK_SRC="android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="SchoolOS_Plus_${VERSION_TAG}.apk"
          # Try release first, fall back to unsigned
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          cp "$APK_SRC" "$APK_DEST"
          echo "APK_FILE=$APK_DEST" >> $GITHUB_ENV
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          echo "✅ APK ready: $APK_DEST"

      - name: 🚀 Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "SchoolOS+ ${{ env.VERSION_TAG }}"
          body: "🚀 Automated release from GitHub Actions CI/CD pipeline.\n\nNote: The primary direct download link for users points to Supabase Storage."
          files: ${{ env.APK_FILE }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Upload APK to Supabase Storage
        # Uploads the APK to a public 'app-updates' bucket in Supabase
        # This avoids the 404 error caused by private GitHub repository release assets.
        run: |
          APK_FILE="${{ env.APK_FILE }}"
          echo "Uploading versioned $APK_FILE to Supabase Storage..."
          
          HTTP_STATUS=$(curl -sS -o /tmp/upload_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/app-updates/${APK_FILE}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_FILE}")
            
          cat /tmp/upload_response.txt
          echo ""
          
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Versioned upload failed with status $HTTP_STATUS"
            exit 1
          fi
          
          echo "Uploading static SchoolOS_Plus.apk to Supabase Storage..."
          HTTP_STATUS_STATIC=$(curl -sS -o /tmp/upload_static_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/app-updates/SchoolOS_Plus.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@${APK_FILE}")
            
          cat /tmp/upload_static_response.txt
          echo ""
          
          if [ "$HTTP_STATUS_STATIC" != "200" ] && [ "$HTTP_STATUS_STATIC" != "201" ]; then
            echo "❌ Static upload failed with status $HTTP_STATUS_STATIC"
            exit 1
          fi
          
          echo "✅ Uploads successful!"

      - name: 🧹 Auto-Delete Old APKs (Keep Last 2)
        run: |
          HTTP_STATUS=$(curl -sS -o /tmp/apk_list.json -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/list/app-updates" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":100,"offset":0,"sortBy":{"column":"created_at","order":"desc"}}')
          
          echo "List HTTP status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Failed to list bucket objects. Response:"
            cat /tmp/apk_list.json
            exit 1
          fi
          
          FILE_NAMES=$(jq -r '.[] | select(.name | endswith(".apk") and . != "SchoolOS_Plus.apk") | .name' /tmp/apk_list.json)
          COUNT=$(echo "$FILE_NAMES" | grep -c ".apk" || true)
          
          if [ "$COUNT" -gt 2 ]; then
            echo "Found $COUNT APKs. Deleting older versions..."
            FILES_TO_DELETE=$(echo "$FILE_NAMES" | tail -n +3)
            for FILE in $FILES_TO_DELETE; do
              echo "Deleting old APK: $FILE"
              curl -sS -X DELETE "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/app-updates/$FILE" \
                -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            done
            echo "✅ Old APKs deleted."
          else
            echo "✅ $COUNT APKs exist. No cleanup needed."
          fi

      - name: 📝 Register Version in Supabase
        # Stores the public direct APK download URL from Supabase Storage in app_versions.
        # VersionChecker.jsx uses this URL to open the APK in the system browser.
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="${{ env.VERSION_TAG }}"
          APK_FILE="${{ env.APK_FILE }}"
          
          # Supabase Storage public direct download URL
          APK_URL="${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/public/app-updates/${APK_FILE}"
          
          curl -sS -X POST "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/app_versions" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            -d "{
              \"version_code\": $VERSION_CODE,
              \"version_name\": \"$VERSION_NAME\",
              \"apk_url\": \"$APK_URL\",
              \"release_notes\": \"Automated CI/CD release $VERSION_NAME from GitHub Actions.\",
              \"is_critical\": false
            }"
          echo "Version $VERSION_NAME (code: $VERSION_CODE) registered in Supabase."
          echo "Direct APK URL: $APK_URL"

      - name: 🔔 Notify All Devices via FCM
        # Calls notify-update Edge Function which fans out FCM push notifications
        # to every device_token row. Users learn about the update without opening app.
        run: |
          HTTP_STATUS=$(curl -sS -o /tmp/notify_response.txt -w "%{http_code}" \
            -X POST "${{ secrets.VITE_SUPABASE_URL }}/functions/v1/notify-update" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"version_name\": \"${{ env.VERSION_TAG }}\", \"release_notes\": \"SchoolOS+ ${{ env.VERSION_TAG }} is now available. Open the app to install it.\"}")
          echo "Notify HTTP status: $HTTP_STATUS"
          cat /tmp/notify_response.txt
