name: Build Android APK (SchoolOS+)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually click "Run workflow" from GitHub UI

jobs:
  build-apk:
    name: Build SchoolOS+ APK
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install

      - name: 🏗️ Build React Vite Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: 🎨 Generate App Icons
        run: npx @capacitor/assets generate --android

      - name: 🚀 Add & Sync Capacitor Android Platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: ☕ Setup Java JDK 17 (Required for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔨 Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: ⚙️ Compile Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📤 Upload APK as SchoolOS_Plus
        uses: actions/upload-artifact@v4
        with:
          name: SchoolOS_Plus
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
