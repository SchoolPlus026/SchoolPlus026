name: Deploy Supabase Edge Functions (SchoolOS+)

on:
  push:
    branches: ["main", "master"]
    paths:
      # Only trigger this workflow when Edge Function code actually changes.
      # This prevents unnecessary deployments on every push.
      - "supabase/functions/**"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  deploy-edge-functions:
    name: 🚀 Deploy Edge Functions to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────
      # The official Supabase CLI GitHub Action.
      # It installs the correct version of the CLI automatically — no manual
      # installation required. Authentication is handled via the access token.
      # ─────────────────────────────────────────────────────────────────────
      - name: ⚙️ Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      # ─────────────────────────────────────────────────────────────────────
      # Deploy ONLY the send-notice-notification function.
      # The --no-verify-jwt flag is intentional: this function is called by
      # a PostgreSQL pg_net trigger (server-to-server), not by an authenticated
      # browser client. The trigger passes the Authorization header with the
      # service role key, but the JWT verification step should be skipped
      # to prevent false 401 rejections on cold-start invocations.
      - name: 🔔 Deploy Edge Functions
        run: |
          # Deploy all functions
          # Note: platform-create-school DOES verify JWT (called by authenticated UI users)
          # Note: notification functions skip JWT verification (called by pg_net server triggers)
          FUNCTIONS_NO_JWT=("send-notice-notification" "process-notification-queue" "cron-notification-scheduler")
          FUNCTIONS_WITH_JWT=("platform-create-school" "platform-delete-school" "approve-school-registration" "school-self-upgrade" "gdrive-upload" "gdrive-auth")
          
          for func in "${FUNCTIONS_NO_JWT[@]}"; do
            if [ -d "supabase/functions/$func" ]; then
              echo "Deploying $func (no JWT verify)..."
              supabase functions deploy "$func" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --no-verify-jwt
            fi
          done
          
          for func in "${FUNCTIONS_WITH_JWT[@]}"; do
            if [ -d "supabase/functions/$func" ]; then
              echo "Deploying $func (with JWT verify)..."
              supabase functions deploy "$func" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: ✅ Deployment Complete
        run: |
          echo "────────────────────────────────────────────────"
          echo "✅ Edge Functions deployed successfully!"
          echo "   Project: ${{ secrets.SUPABASE_PROJECT_ID }}"
          echo "   Branch : ${{ github.ref_name }}"
          echo "────────────────────────────────────────────────"
