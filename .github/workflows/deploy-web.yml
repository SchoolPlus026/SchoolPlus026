name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install

      - name: 🔐 Create .env file from GitHub Secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_APP_VERSION_CODE=${{ github.run_number }}" >> .env
          echo "VITE_APP_VERSION_NAME=${{ github.ref_name }}" >> .env

      - name: 🏗️ Build React Vite Web Assets
        run: npm run build

      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: schoolpro-d95a8

      - name: ⚡ Deploy Supabase Edge Functions
        # Ensures the live Supabase runtime always matches the code in supabase/functions/
        # Without this step, Edge Function changes are silently ignored by CI/CD.
        run: |
          npx supabase functions deploy gdrive-auth --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy gdrive-upload --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy process-notification-queue --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy send-notice-notification --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          echo "✅ All Edge Functions deployed to Supabase project ${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
