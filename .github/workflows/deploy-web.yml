# Trigger rebuild - Aligned Firebase Credentials
name: Deploy Web to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Firebase
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔧 Configure NPM
        run: npm config set legacy-peer-deps true

      - name: 📥 Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: 🔐 Create .env file from GitHub Secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}" >> .env
          echo "VITE_APP_VERSION_CODE=${{ github.run_number }}" >> .env
          echo "VITE_APP_VERSION_NAME=${{ github.ref_name }}" >> .env
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_DATABASE_URL=${{ secrets.VITE_FIREBASE_DATABASE_URL }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}" >> .env
          echo "✅ .env written with Supabase + Firebase vars"
 
      - name: 🏗️ Build React Vite Web Assets
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_APP_VERSION_CODE: ${{ github.run_number }}
          VITE_APP_VERSION_NAME: ${{ github.ref_name }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: 🔐 Generate assetlinks.json for WebAuthn/Passkeys
        run: |
          mkdir -p dist/.well-known
          
          # We need the keystore to extract the SHA256
          KEYSTORE_PATH="/tmp/schoolos.jks"
          B64="${{ secrets.KEYSTORE_BASE64 }}"
          
          if [ -n "$B64" ] && [ "$B64" != "" ]; then
            echo "$B64" | base64 --decode > "$KEYSTORE_PATH"
            
            # Extract SHA256 using keytool
            SHA256=$(keytool -list -v -keystore "$KEYSTORE_PATH" -alias schoolos -storepass "${{ secrets.STORE_PASSWORD }}" | grep "SHA256:" | awk '{print $2}')
            
            echo "Extracted SHA256: $SHA256"
            
            # Create assetlinks.json (using printf to avoid heredoc indentation issues in YAML)
            printf '[{"relation":["delegate_permission/common.handle_all_urls","delegate_permission/common.get_login_creds"],"target":{"namespace":"android_app","package_name":"com.schoolsaas.app","sha256_cert_fingerprints":["%s"]}}]' "$SHA256" > dist/.well-known/assetlinks.json
            echo "✅ assetlinks.json generated dynamically"
          else
            echo "⚠️ KEYSTORE_BASE64 secret not found. Cannot generate assetlinks.json."
            echo "[]" > dist/.well-known/assetlinks.json
          fi

      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: schoolpro-d95a8

      - name: ⚡ Deploy Supabase Edge Functions
        # Ensures the live Supabase runtime always matches the code in supabase/functions/
        # Without this step, Edge Function changes are silently ignored by CI/CD.
        run: |
          npx supabase functions deploy gdrive-auth --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy gdrive-upload --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy process-notification-queue --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy send-notice-notification --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy notify-update --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy create-razorpay-order --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy razorpay-webhook --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy platform-create-school --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy platform-delete-school --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          npx supabase functions deploy approve-school-registration --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          echo "All Edge Functions deployed."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
